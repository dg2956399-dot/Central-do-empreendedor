
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071B3A">
  <title>Entrar | Central do Empreendedor</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #071B3A;
      padding: 20px;
    }

    .login {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 35px 25px;
      border-radius: 18px;
      text-align: center;
    }

    .logo {
      font-size: 45px;
      margin-bottom: 10px;
    }

    h1 {
      color: #071B3A;
      font-size: 25px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #64748b;
      margin-bottom: 28px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-bottom: 15px;
      border: 1px solid #dbe2ea;
      border-radius: 9px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #1769dc;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 9px;
      background: #1769dc;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .links {
      margin-top: 22px;
      font-size: 14px;
      line-height: 2;
    }

    a {
      color: #1769dc;
      text-decoration: none;
    }

    .back {
      display: block;
      margin-top: 20px;
      color: #64748b;
    }
  </style>
</head>

<body>

  <div class="login">
    <div class="logo">💼</div>

    <h1>Central do Empreendedor</h1>

    <p class="subtitle">
      Entre na sua conta e gerencie seu negócio.
    </p>

    <form id="loginForm">
      <input
        type="email"
        id="email"
        placeholder="Seu e-mail"
        required
      >

      <input
        type="password"
        id="senha"
        placeholder="Sua senha"
        required
      >

      <button type="submit">
        Entrar na plataforma
      </button>
    </form>

    <div class="links">
      Ainda não tem conta?
      <a href="cadastro.html">Criar minha conta</a>
    </div>

    <a class="back" href="index.html">
      Voltar ao início
    </a>
  </div>

  <script>
    document.getElementById("loginForm")
      .addEventListener("submit", function(event) {
        event.preventDefault();

        alert("O sistema de autenticação será conectado na próxima etapa.");
      });
  </script>

</body>
</html>
